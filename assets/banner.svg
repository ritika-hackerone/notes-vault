<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Notes Vault - secure full-stack notes app" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="60" y="70" height="90" width="0">
        <animate attributeName="width" from="0" to="470" dur="1.6s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="round"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .sub { opacity: 0; animation: fadeUp 1s ease-out 1.6s forwards; }
    .tags { opacity: 0; animation: fadeUp 1s ease-out 2.1s forwards; }
    .pulse { transform-origin: 790px 128px; animation: pulse 2.6s ease-in-out infinite; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50%      { transform: scale(1.08); opacity: 1; }
    }
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- drifting glow orbs -->
    <circle cx="120" cy="230" r="90" fill="#818cf8" opacity="0.14">
      <animate attributeName="cy" values="230;200;230" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="20" r="70" fill="#a5b4fc" opacity="0.12">
      <animate attributeName="cy" values="20;50;20" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="240" r="110" fill="#c7d2fe" opacity="0.10">
      <animate attributeName="cx" values="860;820;860" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- floating note cards -->
    <g opacity="0.9">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="4.2s" repeatCount="indefinite"/>
        <rect x="620" y="38" width="120" height="70" rx="10" fill="#ffffff" opacity="0.14"/>
        <rect x="634" y="54" width="60" height="7" rx="3.5" fill="#fff" opacity="0.8"/>
        <rect x="634" y="72" width="90" height="5" rx="2.5" fill="#fff" opacity="0.45"/>
        <rect x="634" y="85" width="72" height="5" rx="2.5" fill="#fff" opacity="0.45"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 12; 0 0" dur="5.4s" repeatCount="indefinite"/>
        <rect x="700" y="165" width="130" height="70" rx="10" fill="#ffffff" opacity="0.12"/>
        <rect x="714" y="181" width="70" height="7" rx="3.5" fill="#fff" opacity="0.75"/>
        <rect x="714" y="199" width="98" height="5" rx="2.5" fill="#fff" opacity="0.4"/>
        <rect x="714" y="212" width="60" height="5" rx="2.5" fill="#fff" opacity="0.4"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="6.1s" repeatCount="indefinite"/>
        <rect x="560" y="150" width="105" height="62" rx="10" fill="#ffffff" opacity="0.10"/>
        <rect x="573" y="165" width="50" height="6" rx="3" fill="#fff" opacity="0.7"/>
        <rect x="573" y="181" width="78" height="5" rx="2.5" fill="#fff" opacity="0.38"/>
      </g>
    </g>

    <!-- lock icon -->
    <g class="pulse">
      <path d="M770 120 v-14 a20 20 0 0 1 40 0 v14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <rect x="758" y="120" width="64" height="48" rx="10" fill="#fff"/>
      <circle cx="790" cy="140" r="6" fill="#4f46e5"/>
      <rect x="787.5" y="144" width="5" height="12" rx="2.5" fill="#4f46e5"/>
    </g>

    <!-- title (typed reveal) -->
    <g clip-path="url(#reveal)">
      <text x="60" y="140" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="1">Notes Vault</text>
    </g>
    <rect x="534" y="88" width="4" height="58" rx="2" fill="#c7d2fe">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text class="sub" x="62" y="178" font-size="22" fill="#e0e7ff">Your notes. Your account. Nobody else's business.</text>
    <text class="tags" x="62" y="214" font-size="15" fill="#a5b4fc" letter-spacing="2">REACT  •  EXPRESS  •  POSTGRES  •  JWT</text>
  </g>
</svg>
